<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="calculator_interface">

        <div class="display">
            <div class="display_container">
                0
            </div>
        </div>
            <div class="numbers_row">
                <button class="short_btn">AC</button>
                <button class="short_btn">DEL</button>
            </div>
            <div class="numbers_row">
                <button class="short_btn">7</button>
                <button class="short_btn">8</button>
                <button class="short_btn">9</button>
                <button class="short_btn operation">/</button>
            </div>
            <div class="numbers_row">
                <button class="short_btn">4</button>
                <button class="short_btn">5</button>
                <button class="short_btn">6</button>
                <button class="short_btn operation">*</button>
            </div>
            <div class="numbers_row">
                <button class="short_btn">1</button>
                <button class="short_btn">2</button>
                <button class="short_btn">3</button>
                <button class="short_btn operation">-</button>
            </div>
            <div class="numbers_row">
                <button class="short_btn">0</button>
                <button class="short_btn">.</button>
                <button class="short_btn" id="equal">=</button>
                <button class="short_btn operation">+</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
